<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MPI MapReduce - Word Count</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0d1117; color: #c9d1d9; font-family: 'Segoe UI', sans-serif; padding: 20px; }
    h1 { text-align: center; color: #58a6ff; margin-bottom: 6px; font-size: 1.8rem; }
    .subtitle { text-align: center; color: #8b949e; margin-bottom: 24px; font-size: 0.9rem; }

    .controls { display: flex; justify-content: center; align-items: center; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
    label { color: #8b949e; font-size: 0.9rem; }
    select {
      background: #161b22; color: #c9d1d9; border: 1px solid #30363d;
      padding: 8px 14px; border-radius: 6px; font-size: 0.95rem;
    }
    button {
      background: #238636; color: #fff; border: none;
      padding: 10px 28px; border-radius: 6px; font-size: 1rem;
      cursor: pointer; transition: background 0.2s;
    }
    button:hover { background: #2ea043; }
    button:disabled { background: #3d4d3d; cursor: not-allowed; }

    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 24px; }
    .stat-card {
      background: #161b22; border: 1px solid #30363d;
      border-radius: 8px; padding: 16px; text-align: center;
    }
    .stat-card .val { font-size: 1.6rem; font-weight: bold; color: #58a6ff; }
    .stat-card .lbl { font-size: 0.78rem; color: #8b949e; margin-top: 4px; }

    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
    @media(max-width: 700px) { .two-col { grid-template-columns: 1fr; } }

    .panel { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 16px; }
    .panel h3 { color: #58a6ff; margin-bottom: 12px; font-size: 1rem; }

    .word-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; font-size: 0.85rem; }
    .word-bar .wlabel { width: 110px; text-align: right; color: #c9d1d9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .word-bar .track { flex: 1; background: #21262d; border-radius: 4px; height: 14px; }
    .word-bar .fill { height: 14px; border-radius: 4px; background: #1f6feb; transition: width 0.5s; }
    .word-bar .cnt { width: 40px; color: #8b949e; }

    .log-box {
      background: #0d1117; border: 1px solid #30363d; border-radius: 8px;
      padding: 14px; font-family: monospace; font-size: 0.78rem;
      color: #8b949e; max-height: 260px; overflow-y: auto; white-space: pre-wrap;
    }
    .log-box .master { color: #58a6ff; }
    .log-box .worker { color: #3fb950; }
    .log-box .result { color: #f0883e; }

    .spinner { display: inline-block; width: 18px; height: 18px; border: 3px solid #30363d; border-top-color: #58a6ff; border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 8px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .hidden { display: none; }
  </style>
</head>
<body>

<h1>⚡ MPI MapReduce — Word Count</h1>
<p class="subtitle">Distributed word frequency analysis using Master-Worker architecture</p>

<div class="controls">
  <label>MPI Processes:
    <select id="npSelect">
      <option value="2">2 (1 worker)</option>
      <option value="3">3 (2 workers)</option>
      <option value="4" selected>4 (3 workers)</option>
      <option value="5">5 (4 workers)</option>
      <option value="6">6 (5 workers)</option>
      <option value="8">8 (7 workers)</option>
    </select>
  </label>
  <button id="runBtn" onclick="runJob()">▶ Run MapReduce</button>
</div>

<div class="stats-grid">
  <div class="stat-card"><div class="val" id="sUnique">—</div><div class="lbl">Unique Words</div></div>
  <div class="stat-card"><div class="val" id="sTime">—</div><div class="lbl">Exec Time (s)</div></div>
  <div class="stat-card"><div class="val" id="sProcs">—</div><div class="lbl">Processes</div></div>
  <div class="stat-card"><div class="val" id="sWorkers">—</div><div class="lbl">Workers</div></div>
  <div class="stat-card"><div class="val" id="sThroughput">—</div><div class="lbl">Words/sec</div></div>
</div>

<div class="two-col">
  <div class="panel">
    <h3>📊 Top 20 Words</h3>
    <div id="wordBars">
      <p style="color:#8b949e;font-size:0.85rem;">Run the job to see results.</p>
    </div>
  </div>
  <div class="panel">
    <h3>📈 Word Frequency Chart</h3>
    <canvas id="wordChart" height="260"></canvas>
  </div>
</div>

<div class="panel" style="margin-bottom:24px;">
  <h3>🖥️ Execution Log</h3>
  <div class="log-box" id="logBox">Waiting for job...</div>
</div>

<script>
let chartInstance = null;

async function runJob() {
  const np = parseInt(document.getElementById('npSelect').value);
  const btn = document.getElementById('runBtn');
  const log = document.getElementById('logBox');

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Running...';
  log.innerHTML = 'Starting MPI job with ' + np + ' processes...\n';

  try {
    const res = await fetch('/api/run', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ np })
    });
    const data = await res.json();

    if (!data.success) {
      log.textContent = 'Error: ' + data.error;
      return;
    }

    // Stats
    document.getElementById('sUnique').textContent = data.unique_words.toLocaleString();
    document.getElementById('sTime').textContent = data.exec_time.toFixed(4);
    document.getElementById('sProcs').textContent = data.processes;
    document.getElementById('sWorkers').textContent = data.workers;
    document.getElementById('sThroughput').textContent = data.throughput.toLocaleString();

    // Word bars
    const bars = document.getElementById('wordBars');
    bars.innerHTML = '';
    const maxCount = data.top_words.length > 0 ? data.top_words[0].count : 1;
    data.top_words.forEach(w => {
      const pct = Math.round((w.count / maxCount) * 100);
      bars.innerHTML += `
        <div class="word-bar">
          <div class="wlabel">${w.word}</div>
          <div class="track"><div class="fill" style="width:${pct}%"></div></div>
          <div class="cnt">${w.count}</div>
        </div>`;
    });

    // Chart
    const labels = data.top_words.map(w => w.word);
    const counts = data.top_words.map(w => w.count);
    if (chartInstance) chartInstance.destroy();
    const ctx = document.getElementById('wordChart').getContext('2d');
    chartInstance = new Chart(ctx, {
      type: 'bar',
      data: {
        labels,
        datasets: [{
          label: 'Word Count',
          data: counts,
          backgroundColor: '#1f6feb',
          borderRadius: 4
        }]
      },
      options: {
        responsive: true,
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { color: '#8b949e', maxRotation: 45 }, grid: { color: '#21262d' } },
          y: { ticks: { color: '#8b949e' }, grid: { color: '#21262d' } }
        }
      }
    });

    // Colorize log
    let colored = '';
    data.log.split('\n').forEach(line => {
      if (line.includes('[Master]')) colored += `<span class="master">${line}</span>\n`;
      else if (line.includes('[Worker')) colored += `<span class="worker">${line}</span>\n`;
      else if (line.includes('RESULTS') || line.includes('Total') || line.includes('Top'))
        colored += `<span class="result">${line}</span>\n`;
      else colored += line + '\n';
    });
    log.innerHTML = colored;
    log.scrollTop = log.scrollHeight;

  } catch(e) {
    log.textContent = 'Request failed: ' + e.message;
  } finally {
    btn.disabled = false;
    btn.innerHTML = '▶ Run MapReduce';
  }
}
</script>

</body>
</html>
